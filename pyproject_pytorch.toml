[project_Pytroch]
name = "secuestro Neural Netwoek"
version = "0.0.1"
description = "Modelamiento con PyTorch"
authors = [
    {name = "Pablo Reyes",email = "alejogranados229@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    python        = "^3.8"
    torch         = ">=1.8,<2.7"
    pandas        = ">=1.0,<2.0"
    numpy         = ">=1.18,<2.0"
    matplotlib    = ">=3.0,<4.0"
    ipython       = ">=7.0,<8.0"
    scikit-learn  = ">=1.0,<2.0"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"