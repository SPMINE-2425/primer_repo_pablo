[project]
name = "secuestro"
version = "0.0.1"
description = "Exploracion secuestros"
authors = [
    {name = "Pablo Reyes",email = "alejogranados229@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    python      =  "^3.8"
    pandas      = ">=1.0,<2.0"
    numpy       = ">=1.18,<2.0"
    matplotlib  = ">=3.0,<4.0"
    seaborn     = ">=0.10,<1.0"
    geopandas   = ">=0.10,<1.0"
    ipywidgets  = ">=7.0,<8.0"
    ipython     = ">=7.0,<8.0"       
    statsmodels = ">=0.12,<1.0"
    contextily  = ">=1.0,<2.0"
    scikit-learn= ">=1.0,<2.0"
    scipy       = ">=1.5,<2.0"
    adjusttext  = ">=0.8,<1.0"
    linearmodels= ">=0.6,<1.0"
    xgboost     = ">=1.0,<2.0"
    shap        = ">=0.40,<1.0"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
