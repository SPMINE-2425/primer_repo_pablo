<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portafolio de Proyectos - Pablo Reyes</title>
  <!-- Fuente -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-bg: #f5f7fa;
      --color-primary: #2c3e50;
      --color-accent: #18bc9c;
      --color-text: #34495e;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--color-bg); color: var(--color-text); line-height: 1.6; }
    header {
      background: var(--color-primary);
      color: #fff;
      padding: 2rem 1rem;
      text-align: center;
    }
    header h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
    header p { font-size: 1.1rem; max-width: 600px; margin: 0.5rem auto; }
    header a { color: #fff; text-decoration: underline; }
    .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
    .container h2 { color: var(--color-primary); margin-bottom: 1rem; }
    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
      overflow: hidden;
      transform: translateY(20px);
      opacity: 0;
      animation: fadeInUp 0.6s ease forwards;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .card-content { padding: 1rem; }
    .card-title { font-size: 1.25rem; margin-bottom: 0.5rem; color: var(--color-primary); }
    .card-desc { font-size: 0.95rem; margin-bottom: 1rem; }
    .card a { text-decoration: none; color: var(--color-accent); font-weight: 600; }
    .card:hover { transform: translateY(-5px) scale(1.02); transition: transform 0.3s; }
    footer {
      text-align: center;
      padding: 1rem 0;
      font-size: 0.9rem;
      color: var(--color-text);
    }
  </style>
</head>
<body>
  <header>
    <h1>Pablo Reyes</h1>
    <p>Economista y analista de datos especializado en econometría, machine learning y visualización.<br>Bienvenido a mi portafolio de proyectos en GitHub.</p>
    <p><a href="https://github.com/pablo-reyes8" target="_blank">Visita mi GitHub</a></p>
  </header>

  <div class="container">
    <h2>Proyectos Destacados</h2>
    <div id="projects" class="projects"></div>
  </div>

  <footer>
    &copy; 2025 Pablo Reyes. Todos los derechos reservados.
  </footer>

  <script>
    async function fetchPinned() {
      const pinnedNames = [
        'bayesian-sgdlm',
        'colombia-tourism-ml-forecasting',
        'bayesian_structural_var',
        'colombia-subsidy-ml-prediction',
        'EndToEnd-NeuralNetwork-Diabetes-Prediction-Pipeline',
        'income-inequality-colombia'
      ];
      try {
        const response = await fetch('https://api.github.com/users/pablo-reyes8/repos?per_page=100');
        const repos = await response.json();
        const container = document.getElementById('projects');
        pinnedNames.forEach((name, index) => {
          const repo = repos.find(r => r.name === name);
          if (!repo) return;
          const card = document.createElement('div');
          card.className = 'card';
          card.style.animationDelay = `${index * 0.1}s`;
          card.innerHTML = `
            <div class="card-content">
              <h3 class="card-title">\${repo.name.replace(/-/g, ' ')}</h3>
              <p class="card-desc">\${repo.description || 'Sin descripción'}</p>
              <a href="\${repo.html_url}" target="_blank">Ver repositorio &rarr;</a>
            </div>`;
          container.appendChild(card);
        });
      } catch (error) {
        console.error('Error al cargar los repositorios:', error);
      }
    }
    fetchPinned();
  </script>
</body>
</html>
